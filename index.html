<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genius Jungle - Kids Quiz (Class 1-5, CBSE / ICSE)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--saf:#ff9f1c;--pink:#ff4d8d;--teal:#0ea5a4;--ind:#4338ca;--cream:#fff8e7;--ink:#2b2350;--ok:#16a34a;--bad:#e11d48}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Baloo 2','Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));color:var(--ink);
background:linear-gradient(135deg,#ffd166,#ff8fab 55%,#a78bfa);background-attachment:fixed}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);width:100%;max-width:640px;padding:24px;position:relative}
.ctl{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:2}
.ctl button{width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:1.1rem;cursor:pointer}
.ctl button.off{opacity:.4}
.screen{display:none}.screen.on{display:block;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
h1{font-size:2.3rem;font-weight:800;text-align:center;line-height:1.1;color:var(--ind)}
.sub{text-align:center;margin:6px 0 14px;font-weight:500}
.hero{font-size:3.4rem;text-align:center;animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.lab{font-weight:800;margin:10px 0 6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:9px 6px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:1.02rem;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--saf);box-shadow:3px 3px 0 var(--ink)}
.big{width:100%;margin-top:16px;padding:14px;border:3px solid var(--ink);border-radius:16px;background:var(--pink);color:#fff;font-size:1.3rem;font-weight:800;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap;padding-right:170px}
.pill{background:var(--ind);color:#fff;padding:3px 12px;border-radius:20px;font-size:.9rem}
.pill.s{background:var(--teal)}.pill.f{background:var(--saf);color:var(--ink)}
.bar{height:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;margin:10px 0 6px;overflow:hidden}
.bar div{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--teal),var(--teal) 10px,#2dd4bf 10px,#2dd4bf 20px);transition:width .4s}
#shelf{min-height:26px;font-size:1.2rem;line-height:1.2;margin-bottom:6px}
#shelf small{font-size:.8rem;font-weight:700;opacity:.7}
.mas{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mas span{font-size:2.6rem}
.mas.hop span{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-14px) scale(1.2)}}
.bub{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-weight:700;flex:1}
#qt{font-size:1.35rem;font-weight:700;line-height:1.3;margin:6px 0}
.rd{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:2px 10px;font-weight:700;cursor:pointer;font-size:.9rem;margin-bottom:4px}
#vis{justify-content:center;align-items:center;background:#fff;border:3px dashed var(--ind);border-radius:18px;margin:8px 0 14px;padding:10px;min-height:90px}
.em{font-size:2.1rem;text-align:center;line-height:1.3;word-break:break-word}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.opts{grid-template-columns:1fr}h1{font-size:1.9rem}.top{padding-right:0;margin-top:40px}}
.opt{padding:12px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-size:1.25rem;font-weight:800;cursor:pointer;color:var(--ink);transition:transform .15s}
.opt::first-letter{text-transform:uppercase}
.opt:hover:not(:disabled){background:#e0e7ff;transform:translateY(-3px)}
.opt:disabled{cursor:default}
.opt.ok{background:#bbf7d0;border-color:var(--ok);animation:pop .4s}
.opt.no{background:#fecdd3;border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#ex{display:none;background:#e0f2fe;border:3px solid var(--ink);border-radius:16px;padding:12px 16px;margin-top:14px}
#ex b{color:var(--ind);font-size:1.1rem}
#ex li{list-style:none;margin-top:5px;font-weight:500}
#nx{display:none;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.stars{font-size:3rem;text-align:center;margin:8px 0}
.haul{font-size:1.6rem;text-align:center;line-height:1.4;word-break:break-word}
.fall{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="card">
<div class="ctl">
  <button id="rst" title="Restart Quiz" style="display:none;" onclick="restartQuiz()">🔄</button>
  <button id="home" title="Quit to Main Menu" style="display:none;" onclick="quitToHome()">🏠</button>
  <button id="snd" title="Sound and voice" onclick="tg('snd')">🔊</button>
  <button id="mus" title="Music" onclick="tg('mus')">🎵</button>
</div>

<div class="screen on" id="s0">
  <div class="hero">🦁</div>
  <h1>Genius Jungle!</h1>
  <p class="sub">Roar through Maths, English &amp; EVS and collect stickers 🎉</p>
  <div class="lab">Subject</div>
  <div class="seg">
    <button class="on" onclick="sel('sub','Maths',this)">➗ Maths</button>
    <button onclick="sel('sub','English',this)">📖 English</button>
    <button onclick="sel('sub','EVS',this)">🌍 EVS &amp; GK</button>
  </div>
  <div class="lab">Class</div>
  <div class="seg">
    <button onclick="sel('cls','Class 1',this)">1</button>
    <button class="on" onclick="sel('cls','Class 2',this)">2</button>
    <button onclick="sel('cls','Class 3',this)">3</button>
    <button onclick="sel('cls','Class 4',this)">4</button>
    <button onclick="sel('cls','Class 5',this)">5</button>
  </div>
  <div class="lab">Board</div>
  <div class="seg">
    <button class="on" onclick="sel('brd','CBSE',this)">CBSE</button>
    <button onclick="sel('brd','ICSE',this)">ICSE</button>
  </div>
  <div class="lab">How many questions?</div>
  <div class="seg">
    <button class="on" onclick="sel('cnt',10,this)">Quick 10</button>
    <button onclick="sel('cnt',25,this)">25</button>
    <button onclick="sel('cnt',50,this)">Max 50</button>
  </div>
  <button class="big" onclick="start()">Let's Play! 🚀</button>
</div>

<div class="screen" id="s1">
  <div class="top"><span class="pill" id="bd"></span><span class="pill f" id="stk">🔥 0</span><span class="pill s" id="sc">⭐ 0</span></div>
  <div class="bar"><div id="pg"></div></div>
  <div id="shelf"></div>
  <div class="mas" id="mas"><span>🦁</span><div class="bub" id="say">Let's go!</div></div>
  <div id="qt"></div>
  <button class="rd" onclick="talk(Q[i].t)">🔊 Read to me</button>
  <div id="vis"></div>
  <div class="opts" id="opts"></div>
  <div id="ex"><b id="et"></b><ul id="es"></ul></div>
  <button class="big" id="nx" onclick="next()">Next ➜</button>
</div>

<div class="screen" id="s2">
  <div class="hero">🏆</div>
  <h1 id="rt">Shabash!</h1>
  <div class="stars" id="rs"></div>
  <p class="sub" id="rp"></p>
  <div class="haul" id="hl"></div>
  <button class="big" onclick="start()">Play Again 🔄</button>
  <button class="big" style="background:var(--teal)" onclick="quitToHome()">Change Subject / Class</button>
</div>

</div>

<script>
const S={sub:'Maths',cls:'Class 2',brd:'CBSE',cnt:10};
let rng,Q=[],i=0,sc=0,st=0,ok=0,done=false,AC,mute=false,musOn=true,bg,stk=[];
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(rng()*(b-a+1)),pk=a=>a[ri(0,a.length-1)];
const sh=a=>{a=[...a];for(let j=a.length-1;j>0;j--){const k=ri(0,j);[a[j],a[k]]=[a[k],a[j]]}return a};
const shr=a=>[...a].sort(()=>Math.random()-.5),rp=a=>a[Math.floor(Math.random()*a.length)];
const seed=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const uq=a=>[...new Set(a.map(String))];
const near=(a,mn=0)=>sh([-1,1,-2,2,-3,3,-10,10,-5,5].map(d=>a+d).filter(x=>x>=mn&&x!=a)).slice(0,3);
const mk=(t,v,a,ds,e)=>{a=String(a);ds=uq(ds).filter(x=>x!==a).slice(0,3);return{t,v,a,o:sh([a,...ds]),e}};
const em=s=>`<div class="em">${s}</div>`;
const NM={CBSE:['Aarav','Diya','Rohan','Priya','Kabir','Meera','Arjun','Isha'],ICSE:['Ananya','Vihaan','Sneha','Aditya','Riya','Krish','Tara','Yash']};
const nm=()=>pk(NM[S.brd]);
const IT=[['🥭','mangoes'],['🪁','kites'],['🪔','diyas'],['🏏','cricket bats'],['🎈','balloons'],['🍌','bananas'],['🌸','flowers'],['🐘','elephants'],['🦚','peacocks'],['⭐','stars'],['🍬','laddoos'],['🛺','auto-rickshaws']];
const D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MD=[31,28,31,30,31,30,31,31,30,31,30,31];
const SHP={circle:c=>`<circle cx="50" cy="50" r="40" fill="${c}"/>`,square:c=>`<rect x="15" y="15" width="70" height="70" fill="${c}"/>`,triangle:c=>`<polygon points="50,10 10,88 90,88" fill="${c}"/>`,rectangle:c=>`<rect x="5" y="28" width="90" height="44" fill="${c}"/>`};
const RM=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
const rom=n=>['','X','XX','XXX','XL','L'][n/10|0]+RM[n%10];
const tm=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;
const clock=(h,m)=>{const p=(a,l)=>`x2="${50+l*Math.sin(a*Math.PI/180)}" y2="${50-l*Math.cos(a*Math.PI/180)}"`;let n='';for(let k=1;k<=12;k++)n+=`<text x="${50+35*Math.sin(k*Math.PI/6)}" y="${54-35*Math.cos(k*Math.PI/6)}" font-size="9" font-weight="bold" text-anchor="middle">${k}</text>`;return `<svg width="150" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#4338ca" stroke-width="3"/>${n}<line x1="50" y1="50" ${p(h%12*30+m/2,22)} stroke="#e11d48" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" ${p(m*6,33)} stroke="#2b2350" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="3"/></svg>`};
const pie=(n,k)=>{let s='';for(let j=0;j<n;j++){const a=j*2*Math.PI/n,b=(j+1)*2*Math.PI/n,f=x=>`${50+45*Math.sin(x)} ${50-45*Math.cos(x)}`;s+=`<path d="M50 50 L${f(a)} A45 45 0 0 1 ${f(b)}Z" fill="${j<k?'#ff9f1c':'#fff1c9'}" stroke="#2b2350" stroke-width="2"/>`}return `<svg width="150" viewBox="0 0 100 100">${s}</svg>`};
const rect=(l,w,u)=>`<svg width="230" viewBox="0 0 230 130"><rect x="40" y="25" width="${l*10}" height="${w*7}" fill="#c7d2fe" stroke="#4338ca" stroke-width="3"/><text x="${40+l*5}" y="18" text-anchor="middle" font-weight="bold" font-size="13">${l} ${u}</text><text x="${46+l*10}" y="${25+w*3.5}" font-weight="bold" font-size="13">${w} ${u}</text></svg>`;
const frs=(n,k)=>[`${n-k}/${n}`,`${k}/${n+1}`,`${k+1}/${n}`,`${k}/${n+2}`,`1/${n}`];

/* ---------- MATHS ---------- */
const G={
'Class 1':[
()=>{const[e,p]=pk(IT),n=ri(2,12);return mk(`How many ${p} can you see?`,em(e.repeat(n)),n,near(n,1),['Let\'s count! 🔢',['Point to each one and count: 1, 2, 3 …',`There are ${n} ${p}.`]])},
()=>{const[e,p]=pk(IT),a=ri(1,9),b=ri(1,10);return mk(`${nm()} has ${a} ${p}. A friend gives ${b} more. How many now?`,em(e.repeat(a)+' ➕ '+e.repeat(b)),a+b,near(a+b,1),['Add them up! ➕',[`Start with ${a}.`,`Count ${b} more: ${a} + ${b} = ${a+b}.`]])},
()=>{const[e,p]=pk(IT),a=ri(5,20),b=ri(1,a-1);return mk(`${nm()} had ${a} ${p} and gave ${b} away. How many are left?`,em(e.repeat(a)),a-b,near(a-b),['Take away! ➖',[`Start with ${a}.`,`Take away ${b}: ${a} − ${b} = ${a-b}.`]])},
()=>{const t=ri(0,2),n=ri(3,98);return t==0?mk(`Which number comes just after ${n}?`,'',n+1,near(n+1),['After means +1 ➡️',[`${n} + 1 = ${n+1}.`]]):t==1?mk(`Which number comes just before ${n}?`,'',n-1,near(n-1),['Before means −1 ⬅️',[`${n} − 1 = ${n-1}.`]]):mk(`Fill in the blank: ${n-1}, __ , ${n+1}`,'',n,near(n),['Number neighbours 🏘️',[`The number between ${n-1} and ${n+1} is ${n}.`]])},
()=>{const x=ri(1,99);let y=ri(1,99);if(y==x)y++;const b=ri(0,1);return mk(`Which number is ${b?'bigger':'smaller'}: ${x} or ${y}?`,'',b?Math.max(x,y):Math.min(x,y),[x,y],['Compare! ⚖️',[`Look at ${x} and ${y}.`,`The ${b?'bigger':'smaller'} one is ${b?Math.max(x,y):Math.min(x,y)}.`]])},
()=>{const k=pk(Object.keys(SHP)),c=pk(['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899']);return mk('What is the name of this shape?',`<svg width="110" viewBox="0 0 100 100">${SHP[k](c)}</svg>`,k,Object.keys(SHP),['Know your shapes! 🔷',['Look at the sides and corners.',`This shape is a ${k}.`]])},
()=>{const j=ri(0,6),f=ri(0,1),a=D[(j+(f?1:6))%7];return mk(`Which day comes ${f?'after':'before'} ${D[j]}?`,'',a,sh(D.filter(x=>x!=a&&x!=D[j])),['Days of the week 📅',[D.join(', ')+'.',`${f?'After':'Before'} ${D[j]} comes ${a}.`]])},
()=>{const n=ri(10,99),t=ri(0,1),a=t?Math.floor(n/10):n%10;return mk(`In the number ${n}, which digit is in the ${t?'tens':'ones'} place?`,'',a,[t?n%10:Math.floor(n/10),(a+1)%10,(a+3)%10,(a+7)%10],['Tens and ones 🔟',[`${n} has ${Math.floor(n/10)} tens and ${n%10} ones.`,`The ${t?'tens':'ones'} digit is ${a}.`]])},
()=>{const a=pk([1,2,5,10]),b=pk([1,2,5,10]);return mk(`${nm()} has a ₹${a} coin and a ₹${b} coin. How much money in all?`,em(`🪙₹${a} ➕ 🪙₹${b}`),`₹${a+b}`,near(a+b,1).map(x=>'₹'+x),['Count the coins 🪙',[`₹${a} + ₹${b} = ₹${a+b}.`]])},
()=>{const s=pk([2,5,10]),a=s*ri(1,3),q=[0,1,2,3].map(k=>a+k*s),n=a+4*s;return mk(`What comes next? ${q.join(', ')}, __`,'',n,near(n),['Skip counting 🐸',[`We add ${s} each time.`,`${q[3]} + ${s} = ${n}.`]])},
()=>{const n=ri(1,60);return mk(`Is ${n} an even or an odd number?`,'',n%2?'odd':'even',['odd','even'],['Even or odd? 👯',[`Even numbers end in 0, 2, 4, 6, 8.`,`${n} is ${n%2?'odd':'even'}.`]])}
],
'Class 2':[
()=>{const a=ri(11,60),b=ri(11,39);return mk(`${a} + ${b} = ?`,'',a+b,near(a+b),['Add tens and ones ➕',[`Ones: ${a%10} + ${b%10} = ${a%10+b%10}.`,`Tens: ${a-a%10} + ${b-b%10} = ${a+b-a%10-b%10}.`,`Total = ${a+b}.`]])},
()=>{const a=ri(30,99),b=ri(10,a-5);return mk(`${a} − ${b} = ?`,'',a-b,near(a-b),['Subtract ➖',[`Take away ${b} from ${a}.`,`${a} − ${b} = ${a-b}.`]])},
()=>{const a=pk([2,3,4,5,10]),b=ri(1,10);return mk(`${a} × ${b} = ?`,'',a*b,near(a*b,1),[`Table of ${a} ✖️`,[`${a} × ${b} means ${b} groups of ${a}.`,`${a} × ${b} = ${a*b}.`]])},
()=>{const n=ri(101,999),t=ri(0,2),a=[Math.floor(n/100),Math.floor(n/10)%10,n%10][t];return mk(`In ${n}, which digit is in the ${['hundreds','tens','ones'][t]} place?`,'',a,[(a+1)%10,(a+2)%10,(a+5)%10,(a+7)%10],['Place value 🏠',[`${n} = ${Math.floor(n/100)} hundreds, ${Math.floor(n/10)%10} tens, ${n%10} ones.`,`Answer: ${a}.`]])},
()=>{const n=pk([2,3,4,6,8]),k=ri(1,n-1);return mk('What fraction of the shape is orange?',pie(n,k),`${k}/${n}`,frs(n,k),['Fractions 🍕',[`Count all equal parts: ${n}.`,`Count orange parts: ${k}.`,`Fraction = ${k}/${n}.`]])},
()=>{const h=ri(1,12),m=pk([0,30]),a=tm(h,m);return mk('What time does the clock show?',clock(h,m),a,[tm(h%12+1,m),tm((h+10)%12+1,m),tm(h,30-m)],['Read the clock ⏰',['The short red hand shows the hour.',m?'The long hand points at 6, so it is half past.':'The long hand points at 12, so it is o\'clock.',`Time is ${a}.`]])},
()=>{const a=ri(5,45),b=ri(5,45),s=ri(0,1),t=ri(60,100);return s?mk(`${nm()} pays ₹${t} for a toy that costs ₹${a}. How much change comes back?`,'',`₹${t-a}`,near(t-a,1).map(x=>'₹'+x),['Find the change 💰',[`₹${t} − ₹${a} = ₹${t-a}.`]]):mk(`A pencil costs ₹${a} and an eraser costs ₹${b}. What is the total?`,'',`₹${a+b}`,near(a+b,1).map(x=>'₹'+x),['Add the prices 💰',[`₹${a} + ₹${b} = ₹${a+b}.`]])},
()=>{const x=ri(100,999);let y=ri(100,999);if(x==y)y++;const b=ri(0,1),a=b?Math.max(x,y):Math.min(x,y);return mk(`Which number is ${b?'greater':'smaller'}: ${x} or ${y}?`,'',a,[x,y],['Compare 3-digit numbers ⚖️',['Compare hundreds first, then tens, then ones.',`The ${b?'greater':'smaller'} number is ${a}.`]])},
()=>{const s=pk([2,3,4,5,10]),a=s*ri(1,4),n=a+4*s;return mk(`What comes next? ${[0,1,2,3].map(k=>a+k*s).join(', ')}, __`,'',n,near(n),['Skip counting 🐸',[`Jump by ${s} each time.`,`Next number: ${n}.`]])},
()=>{const[e,p]=pk(IT),a=ri(2,5),b=ri(2,10);return mk(`${nm()} has ${a} bags with ${b} ${p} in each bag. How many ${p} in all?`,a*b<=30?em(e.repeat(b)+'<br>').repeat(a):'',a*b,near(a*b,1),['Groups! 👜',[`${a} bags × ${b} each.`,`${a} × ${b} = ${a*b}.`]])},
()=>{const a=ri(5,40),x=ri(5,50);return mk(`Find the missing number: __ + ${a} = ${a+x}`,'',x,near(x,1),['Missing number 🕵️',[`Subtract: ${a+x} − ${a} = ${x}.`]])},
()=>{const j=ri(0,11),f=ri(0,1),a=MO[(j+(f?1:11))%12];return mk(`Which month comes ${f?'after':'before'} ${MO[j]}?`,'',a,sh(MO.filter(x=>x!=a&&x!=MO[j])),['Months of the year 🗓️',[`There are 12 months, from January to December.`,`${f?'After':'Before'} ${MO[j]} comes ${a}.`]])},
()=>{const e=2*ri(1,49),o=[1,3,5,7].map(k=>2*ri(1,49)+k-1+(k>1?0:0)).map(x=>x%2?x:x+1);return mk('Which of these is an even number?','',e,o,['Even numbers 👯',['Even numbers end in 0, 2, 4, 6 or 8.',`${e} is even.`]])}
],
'Class 3':[
()=>{const a=ri(120,600),b=ri(120,390);return mk(`${a} + ${b} = ?`,'',a+b,near(a+b),['Add 3-digit numbers ➕',[`Add ones, then tens, then hundreds.`,`${a} + ${b} = ${a+b}.`]])},
()=>{const a=ri(300,999),b=ri(101,a-50);return mk(`${a} − ${b} = ?`,'',a-b,near(a-b),['Subtract 3-digit numbers ➖',['Subtract ones, then tens, then hundreds (borrow if needed).',`${a} − ${b} = ${a-b}.`]])},

function play(k,n=0){if(mute)return;try{ac().resume()}catch(e){}
  if(k=='tap'){note(880,0,.12,'sine',.1);return}

  const v=$('vis');v.innerHTML=q.v;v.style.display=q.v?'flex':'none';
  $('opts').innerHTML='';
  q.o.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>pick(b,o);$('opts').appendChild(b)});$('ex').style.display='none';$('nx').style.display='none';$('say').textContent=i==0?'Let\'s go! Win stickers 🎁':rp(['You can do it! 💪','Think carefully 🤔','Take your time 🌈','Ready? Go! 🚀']);
  $('pg').style.width=i/Q.length*100+'%';
  $('sc').textContent='⭐ '+sc;$('stk').textContent='🔥 '+st;
  $('shelf').innerHTML=stk.join(' ')+(stk.length?'':'<small>Answer right to collect stickers!</small>');
}
function pick(b,o){
  if(done)return;done=true;const q=Q[i],good=o===q.a;
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});
  let msg;
  if(good){sc+=10+Math.min(st,5)*2;st++;ok++;stk.push(rp(ST));play('ok',st);confetti(10+Math.min(st,5)*4);
    msg=STREAK[Math.min(st,5)]&&st>1?STREAK[Math.min(st,5)]:rp(CHEER)+' 🎉';
    const m=$('mas');m.classList.remove('hop');void m.offsetWidth;m.classList.add('hop')}
  else{b.classList.add('no');st=0;play('no');msg=rp(OOPS)}
  if(i+1==Math.ceil(Q.length/2)&&Q.length>3)msg+=' Halfway there! 🎉';
  $('say').textContent=msg;talk(msg);
  $('sc').textContent='⭐ '+sc;$('stk').textContent='🔥 '+st;
  $('shelf').innerHTML=stk.join(' ')+(stk.length?'':'<small>Answer right to collect stickers!</small>');
  $('et').textContent=q.e[0];$('es').innerHTML=q.e[1].map(s=>`<li>👉 ${s}</li>`).join('');
  $('ex').style.display='block';
  const n=$('nx');n.style.display='block';n.textContent=i+1<Q.length?rp(TEASE):'See my result 🏆';
}
function next(){play('tap');i++;i<Q.length?load():finish()}
function finish(){
  const p=ok/Q.length,s=p>=.9?3:p>=.6?2:p>=.3?1:0;
  $('rs').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);
  const t=p>=.9?'Shabash, Champion!':p>=.6?'Wah! Well done!':'Good try! Every champion practises!';
  $('rt').textContent=t;
  $('rp').textContent=`${ok} out of ${Q.length} correct • ${sc} points`;
  $('hl').innerHTML=stk.length?`Your stickers:<br>${stk.join(' ')}`:'Play again to win your first sticker! 🎁';
  show('s2');play('win');talk(t);if(s>0)confetti(50);
}
</script>
